[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurant-finder"
version = "0.1.0"
description = "Recherche automatisée de restaurants (OpenStreetMap) avec enrichissement Instagram et export CSV/Excel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Restaurant Finder Team" }]
keywords = ["restaurant", "openstreetmap", "overpass", "cli", "scraping"]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "requests>=2.31,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "rapidfuzz>=3.9,<4.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "ddgs>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-mock>=3.14,<4.0",
    "responses>=0.25,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "types-requests>=2.31,<3.0",
]

[project.scripts]
restaurant-finder = "restaurant_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
restaurant_finder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Le pattern `typer.Option(...)` / `typer.Argument(...)` en valeur par défaut
# est la façon documentée et recommandée d'utiliser Typer.
"src/restaurant_finder/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["restaurant_finder"]
mypy_path = "src"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
